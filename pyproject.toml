[project]
name = "parrot"
version = "0.1.0"
description = "On device text-to-speech transcription."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Terry Emeigh" }
]
requires-python = ">=3.14"
dependencies = [
    "asciichartpy>=1.5.25",
    "numpy>=2.5.3",
    "sherpa-onnx>=1.13.8",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.34"]

[project.scripts]
parrot = "parrot.cli:repeat"
parrot-scribe = "parrot.cli:scribe"
parrot-serve = "parrot.server:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
